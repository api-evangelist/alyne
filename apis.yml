name: Alyne
description: >-
  Alyne is a cloud-native governance, risk and compliance (GRC) platform, founded
  in Munich in 2015 and acquired by Mitratech in 2021, where it is now offered as
  Mitratech's Alyne. The platform pairs a large curated library of controls and
  regulatory content with AI-assisted risk assessments, control mapping, maturity
  scoring and reporting, helping enterprises and FinTechs manage cyber, operational
  and third-party risk. Alyne is delivered as SaaS through app.alyne.com and is
  positioned to integrate with common IT, compliance and data systems. As of this
  profile Alyne exposes no public developer portal, API reference, or OpenAPI
  definition; this record captures its public identity and probed domain security.
